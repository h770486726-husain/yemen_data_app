
import 'package:flutter/material.dart';
import 'package:flutter_localizations/flutter_localizations.dart';
import 'package:intl/intl.dart';
import 'package:excel/excel.dart';
import 'package:firebase_core/firebase_core.dart';
import 'package:cloud_firestore/cloud_firestore.dart';

void main() async {
  WidgetsFlutterBinding.ensureInitialized();
  await Firebase.initializeApp();
  runApp(const YemenDataApp());
}

class YemenDataApp extends StatelessWidget {
  const YemenDataApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'تطبيق البيانات المباشر',
      debugShowCheckedModeBanner: false,
      locale: const Locale('ar', 'YE'),
      supportedLocales: const [Locale('ar', 'YE')],
      localizationsDelegates: const [
        GlobalMaterialLocalizations.delegate,
        GlobalWidgetsLocalizations.delegate,
        GlobalCupertinoLocalizations.delegate,
      ],
      theme: ThemeData(
        primarySwatch: Colors.red,
        scaffoldBackgroundColor: const Color(0xFFF8F9FA),
      ),
      home: const HomeScreen(),
    );
  }
}

class HomeScreen extends StatelessWidget {
  const HomeScreen({super.key});

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        backgroundColor: const Color(0xFFCE1126),
        title: const Text('🇾🇪 إدارة البيانات المباشرة (أونلاين)'),
      ),
      body: Padding(
        padding: const EdgeInsets.all(16.0),
        child: Column(
          children: [
            ElevatedButton.icon(
              style: ElevatedButton.styleFrom(
                backgroundColor: Colors.black,
                foregroundColor: Colors.white,
                minimumSize: const Size(double.infinity, 50),
              ),
              icon: const Icon(Icons.add_circle_outline),
              label: const Text('إنشاء مجموعة جديدة عبر النت'),
              onPressed: () => _showCreateRoomDialog(context),
            ),
            const SizedBox(height: 20),
            const Align(
              alignment: Alignment.centerRight,
              child: Text(
                'المجموعات المتاحة أونلاين:',
                style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
              ),
            ),
            const SizedBox(height: 10),
            Expanded(
              child: StreamBuilder<QuerySnapshot>(
                stream: FirebaseFirestore.instance.collection('rooms').snapshots(),
                builder: (context, snapshot) {
                  if (snapshot.hasError) return const Center(child: Text('حدث خطأ في الاتصال'));
                  if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());

                  final docs = snapshot.data!.docs;
                  if (docs.isEmpty) return const Center(child: Text('لا توجد مجموعات حالياً'));

                  return ListView.builder(
                    itemCount: docs.length,
                    itemBuilder: (context, index) {
                      final data = docs[index].data() as Map<String, dynamic>;
                      final docId = docs[index].id;
                      return Card(
                        elevation: 2,
                        margin: const EdgeInsets.symmetric(vertical: 6),
                        child: ListTile(
                          title: Text(data['title'] ?? '', style: const TextStyle(fontWeight: FontWeight.bold)),
                          trailing: const Icon(Icons.cloud_done, color: Colors.green),
                          onTap: () => _showLoginDialog(context, docId, data),
                        ),
                      );
                    },
                  );
                },
              ),
            ),
          ],
        ),
      ),
    );
  }

  void _showCreateRoomDialog(BuildContext context) {
    final titleCtrl = TextEditingController();
    final adminPassCtrl = TextEditingController();
    final memberPassCtrl = TextEditingController();

    showDialog(
      context: context,
      builder: (ctx) => AlertDialog(
        title: const Text('إنشاء مجموعة سحابية'),
        content: SingleChildScrollView(
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              TextField(controller: titleCtrl, decoration: const InputDecoration(labelText: 'اسم المجموعة')),
              TextField(controller: adminPassCtrl, decoration: const InputDecoration(labelText: 'كلمة سر المشرف')),
              TextField(controller: memberPassCtrl, decoration: const InputDecoration(labelText: 'كلمة سر الأعضاء')),
            ],
          ),
        ),
        actions: [
          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('إلغاء')),
          ElevatedButton(
            onPressed: () async {
              if (titleCtrl.text.isNotEmpty) {
                await FirebaseFirestore.instance.collection('rooms').add({
                  'title': titleCtrl.text,
                  'adminPasscode': adminPassCtrl.text,
                  'memberPasscode': memberPassCtrl.text,
                  'columns': ['الاسم الرباعي', 'رقم الهاتف', 'الملاحظات'],
                  'createdAt': FieldValue.serverTimestamp(),
                });
                if (context.mounted) Navigator.pop(ctx);
              }
            },
            child: const Text('إنشاء'),
          )
        ],
      ),
    );
  }

  void _showLoginDialog(BuildContext context, String docId, Map<String, dynamic> data) {
    final passCtrl = TextEditingController();
    final nameCtrl = TextEditingController();

    showDialog(
      context: context,
      builder: (ctx) => AlertDialog(
        title: Text('الدخول: ${data['title']}'),
        content: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'اسم المشارك')),
            TextField(controller: passCtrl, obscureText: true, decoration: const InputDecoration(labelText: 'كلمة السر')),
          ],
        ),
        actions: [
          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('إلغاء')),
          ElevatedButton(
            onPressed: () {
              Navigator.pop(ctx);
              if (passCtrl.text == data['adminPasscode']) {
                Navigator.push(context, MaterialPageRoute(builder: (_) => AdminRoomScreen(roomId: docId, roomData: data)));
              } else if (passCtrl.text == data['memberPasscode']) {
                Navigator.push(context, MaterialPageRoute(builder: (_) => MemberRoomScreen(roomId: docId, roomData: data, memberName: nameCtrl.text.isEmpty ? 'عضو' : nameCtrl.text)));
              } else {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('كلمة السر خاطئة')));
              }
            },
            child: const Text('دخول'),
          )
        ],
      ),
    );
  }
}

// واجهة العضو
class MemberRoomScreen extends StatefulWidget {
  final String roomId;
  final Map<String, dynamic> roomData;
  final String memberName;

  const MemberRoomScreen({super.key, required this.roomId, required this.roomData, required this.memberName});

  @override
  State<MemberRoomScreen> createState() => _MemberRoomScreenState();
}

class _MemberRoomScreenState extends State<MemberRoomScreen> {
  final Map<String, TextEditingController> _controllers = {};

  @override
  void initState() {
    super.initState();
    List<dynamic> cols = widget.roomData['columns'] ?? [];
    for (var col in cols) {
      _controllers[col.toString()] = TextEditingController();
    }
  }

  void _submitData() async {
    final now = DateFormat('yyyy-MM-dd hh:mm a').format(DateTime.now());
    Map<String, dynamic> entry = {
      '_memberName': widget.memberName,
      '_submittedAt': now,
      '_timestamp': FieldValue.serverTimestamp(),
    };

    _controllers.forEach((key, ctrl) {
      entry[key] = ctrl.text;
    });

    await FirebaseFirestore.instance.collection('rooms').doc(widget.roomId).collection('submissions').add(entry);

    if (mounted) {
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم الإرسال أونلاين فوراً')));
      _controllers.forEach((_, ctrl) => ctrl.clear());
    }
  }

  @override
  Widget build(BuildContext context) {
    List<dynamic> cols = widget.roomData['columns'] ?? [];
    return Scaffold(
      appBar: AppBar(
        title: Text(widget.roomData['title'] ?? ''),
        backgroundColor: Colors.teal,
        actions: [
          IconButton(
            icon: const Icon(Icons.chat),
            onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => ChatScreen(roomId: widget.roomId, senderName: widget.memberName))),
          )
        ],
      ),
      body: Padding(
        padding: const EdgeInsets.all(16.0),
        child: Column(
          children: [
            ...cols.map((col) => Padding(
                  padding: const EdgeInsets.symmetric(vertical: 8.0),
                  child: TextField(
                    controller: _controllers[col.toString()],
                    decoration: InputDecoration(labelText: col.toString(), border: const OutlineInputBorder()),
                  ),
                )),
            const SizedBox(height: 20),
            ElevatedButton.icon(
              style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white, minimumSize: const Size(double.infinity, 50)),
              icon: const Icon(Icons.cloud_upload),
              label: const Text('إرسال عبر النت'),
              onPressed: _submitData,
            )
          ],
        ),
      ),
    );
  }
}

// واجهة المشرف
class AdminRoomScreen extends StatelessWidget {
  final String roomId;
  final Map<String, dynamic> roomData;

  const AdminRoomScreen({super.key, required this.roomId, required this.roomData});

  @override
  Widget build(BuildContext context) {
    List<dynamic> cols = roomData['columns'] ?? [];
    return Scaffold(
      appBar: AppBar(
        title: Text('إدارة: ${roomData['title']}'),
        backgroundColor: Colors.black,
        actions: [
          IconButton(
            icon: const Icon(Icons.chat),
            onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => ChatScreen(roomId: roomId, senderName: 'المشرف'))),
          )
        ],
      ),
      body: StreamBuilder<QuerySnapshot>(
        stream: FirebaseFirestore.instance.collection('rooms').doc(roomId).collection('submissions').orderBy('_timestamp', descending: true).snapshots(),
        builder: (context, snapshot) {
          if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
          final docs = snapshot.data!.docs;

          return SingleChildScrollView(
            scrollDirection: Axis.horizontal,
            child: SingleChildScrollView(
              child: DataTable(
                columns: [
                  const DataColumn(label: Text('المشارك')),
                  const DataColumn(label: Text('التاريخ')),
                  ...cols.map((c) => DataColumn(label: Text(c.toString()))),
                ],
                rows: docs.map((doc) {
                  final data = doc.data() as Map<String, dynamic>;
                  return DataRow(
                    cells: [
                      DataCell(Text(data['_memberName'] ?? '')),
                      DataCell(Text(data['_submittedAt'] ?? '')),
                      ...cols.map((c) => DataCell(Text(data[c.toString()]?.toString() ?? '-'))),
                    ],
                  );
                }).toList(),
              ),
            ),
          );
        },
      ),
    );
  }
}

// المحادثة المباشرة
class ChatScreen extends StatefulWidget {
  final String roomId;
  final String senderName;

  const ChatScreen({super.key, required this.roomId, required this.senderName});

  @override
  State<ChatScreen> createState() => _ChatScreenState();
}

class _ChatScreenState extends State<ChatScreen> {
  final _msgCtrl = TextEditingController();

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('المحادثة الحية عبر النت')),
      body: Column(
        children: [
          Expanded(
            child: StreamBuilder<QuerySnapshot>(
              stream: FirebaseFirestore.instance.collection('rooms').doc(widget.roomId).collection('messages').orderBy('time', descending: true).snapshots(),
              builder: (context, snapshot) {
                if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                final docs = snapshot.data!.docs;

                return ListView.builder(
                  reverse: true,
                  itemCount: docs.length,
                  itemBuilder: (context, i) {
                    final data = docs[i].data() as Map<String, dynamic>;
                    return ListTile(
                      title: Text(data['sender'] ?? '', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                      subtitle: Text(data['text'] ?? ''),
                    );
                  },
                );
              },
            ),
          ),
          Padding(
            padding: const EdgeInsets.all(8.0),
            child: Row(
              children: [
                Expanded(child: TextField(controller: _msgCtrl, decoration: const InputDecoration(hintText: 'اكتب رسالة أونلاين...'))),
                IconButton(
                  icon: const Icon(Icons.send, color: Colors.teal),
                  onPressed: () async {
                    if (_msgCtrl.text.isNotEmpty) {
                      final txt = _msgCtrl.text;
                      _msgCtrl.clear();
                      await FirebaseFirestore.instance.collection('rooms').doc(widget.roomId).collection('messages').add({
                        'sender': widget.senderName,
                        'text': txt,
                        'time': FieldValue.serverTimestamp(),
                      });
                    }
                  },
                )
              ],
            ),
          )
        ],
      ),
    );
  }
}
